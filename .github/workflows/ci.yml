name: CI

# Runs on every PR into main. This is the review/CI gate from WORKFLOW.md.
# Right now there is no PHP/JS yet, so this only validates the project docs.
# When the plugin + theme land, add the PHP and JS lint jobs below.

on:
  pull_request:
    branches: [main]
  # Allow running by hand from the Actions tab while bootstrapping.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          set -e
          for f in CONTEXT.md WORKFLOW.md README.md LICENSE; do
            if [ ! -f "$f" ]; then
              echo "::error::missing required file: $f"
              exit 1
            fi
          done
          if [ -z "$(ls -A docs/adr/*.md 2>/dev/null)" ]; then
            echo "::error::no ADRs found in docs/adr/"
            exit 1
          fi
          echo "All required docs present."

  e2e:
    name: E2E (wp-env + Playwright)
    runs-on: ubuntu-latest
    # ubuntu-latest ships with Docker, which wp-env needs to boot WordPress.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Boot WordPress (stock core + Remastered plugin & theme)
        run: npm run env:start

      - name: Activate the Remastered block theme
        run: npm run env:activate

      - name: Run the browser-level test suite
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # --- PHP lint + coding standards: add when the plugin grows real PHP ---
  # (see WORKFLOW.md "On PR: lint + PHP/JS checks")
